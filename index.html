<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: portable de bolso em retrato — tela no topo, direcional e botões A/B embaixo. Visual único escuro, deliberado. */
:root{
  --room:#110e22;
  --shell:#4a4396;
  --shell-hi:#625ab9;
  --shell-lo:#2f2a6a;
  --bezel:#1f1d33;
  --btn:#2a2457;
  --btn-press:#171334;
  --ink:#ddd8ff;
  --muted:#9890d4;
  --accent:#ffd23f;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --cs:1;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;min-height:100%;box-sizing:border-box;
  background:var(--room);color:var(--ink);font-family:var(--pixel);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.gba{
  width:100%;max-width:400px;box-sizing:border-box;
  background:linear-gradient(160deg,var(--shell-hi),var(--shell) 35%,var(--shell-lo));
  border-radius:22px 22px 44px 22px;padding:12px 12px 14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.5);
}
.bezel{
  background:var(--bezel);border-radius:12px 12px 12px 30px;padding:10px 10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4);
}
canvas{
  display:block;height:clamp(240px,calc(100svh - 110px - 190px*var(--cs) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),620px);aspect-ratio:160/288;width:auto;max-width:100%;
  object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;background:#0d1333;border-radius:2px;
}
.brand{display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:.08em;color:var(--muted)}
.brand b{color:var(--accent);font-weight:400}
.led{width:6px;height:6px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 6px #ff4b4b}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-inline:4px;touch-action:none}
.dpad,.ab,.ss{zoom:var(--cs)}
.dpad{position:relative;width:114px;height:114px;touch-action:none;flex:none}
.dpad span{position:absolute;background:var(--btn);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.dpad .up{left:38px;top:0;width:38px;height:44px;border-radius:6px 6px 0 0}
.dpad .down{left:38px;bottom:0;width:38px;height:44px;border-radius:0 0 6px 6px}
.dpad .left{top:38px;left:0;width:44px;height:38px;border-radius:6px 0 0 6px}
.dpad .right{top:38px;right:0;width:44px;height:38px;border-radius:0 6px 6px 0}
.dpad .hub{left:38px;top:38px;width:38px;height:38px;box-shadow:none}
.dpad.up .up,.dpad.down .down,.dpad.left .left,.dpad.right .right{background:var(--btn-press);box-shadow:none}
.ab{position:relative;width:138px;height:114px;flex:none}
.btn{
  position:absolute;width:58px;height:58px;border-radius:50%;border:0;
  background:var(--btn);color:var(--muted);font:14px var(--pixel);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.4),0 2px 0 rgba(255,255,255,.08);touch-action:none;cursor:pointer;
}
.btn small{position:absolute;left:50%;top:66px;transform:translateX(-50%);font-size:7px;color:var(--ink);opacity:.75;white-space:nowrap}
.btn.a{right:0;top:6px}
.btn.b{left:4px;bottom:10px}
.btn.on{background:var(--btn-press);box-shadow:none;transform:translateY(2px)}
.btn:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ss{display:flex;justify-content:center;gap:26px;margin-top:6px}
.pill{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:7px var(--pixel);opacity:.8;touch-action:none;cursor:pointer;padding:4px}
.pill i{display:block;width:44px;height:12px;border-radius:8px;background:#26224d;box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
.pill.on i{background:var(--btn-press)}
.hint{font-size:8px;line-height:1.8;color:var(--muted);text-align:center;max-width:400px;margin:0}
@media (pointer:coarse){.hint{display:none}}
/* Paisagem: direcional à esquerda, tela no centro, A/B à direita */
@media (orientation:landscape) and (max-height:560px){
  body{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .gba{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto;grid-template-areas:"dpad screen ab" "sel screen start";
    width:100%;max-width:none;height:100%;align-items:center;justify-items:center;column-gap:14px;padding:10px 18px;border-radius:34px}
  .controls,.ss{display:contents}
  .bezel{grid-area:screen;padding:8px 8px 4px;border-radius:12px}
  canvas{height:calc(100svh - 58px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:none}
  .dpad{grid-area:dpad}.ab{grid-area:ab}
  #bSel{grid-area:sel;zoom:var(--cs)}#bStart{grid-area:start;zoom:var(--cs)}
  .ss{zoom:1}
  .hint{display:none}
}
/* Tela cheia: sem carcaça, tela do jogo o maior possível, controles translúcidos */
body.full{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:#05060f}
body.full .gba{background:none;box-shadow:none;border-radius:0;max-width:none;width:100%;height:100%;padding:0;display:flex;flex-direction:column}
body.full .bezel{background:none;box-shadow:none;border-radius:0;padding:0;flex:1;min-height:0;justify-content:center}
body.full .brand{display:none}
body.full canvas{height:auto;max-height:none;border-radius:0}
body.full .controls{margin-top:6px}
body.full .btn,body.full .dpad span{opacity:.6}
body.full .pill{opacity:.6}
@media (pointer:fine){body.full .controls,body.full .ss{display:none}}
@media (orientation:landscape) and (max-height:560px){
  body.full .gba{display:grid;padding:0 12px;border-radius:0}
  body.full .bezel{height:100%}
}
/* iOS: sem zoom por duplo toque, sem rolagem/elástico, sem menu de toque longo */
html,body{overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;-webkit-touch-callout:none;-webkit-user-select:none;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.gba,.gba *,canvas{touch-action:none;-webkit-touch-callout:none}
</style>
</head>
<body>

<main class="gba">
  <div class="bezel">
    <canvas id="c" width="160" height="288" aria-label="Tela do jogo de padel"></canvas>
    <div class="brand"><span class="led"></span>PADEL <b>ADVANCE</b></div>
  </div>
  <div class="controls">
    <div class="dpad" id="dpad" aria-label="Direcional"><span class="up"></span><span class="down"></span><span class="left"></span><span class="right"></span><span class="hub"></span></div>
    <div class="ab">
      <button class="btn b" id="bB" aria-label="B: lob">B<small>LOB</small></button>
      <button class="btn a" id="bA" aria-label="A: drive">A<small>DRIVE</small></button>
    </div>
  </div>
  <div class="ss">
    <button class="pill" id="bSel"><i></i>PARCEIRO</button>
    <button class="pill" id="bStart"><i></i>START</button>
  </div>
</main>
<p class="hint">1 jogador: setas/WASD movem · J/Z = A · K/X = B · Shift = parceiro · Enter = start/pausa<br>Segure A/B para carregar a força · Bola baixa: A drive, B lob, ↑+A dejada · Bola alta: A remate, B bandeja, ↑+A víbora<br>2 jogadores: J1 WASD + F/G/Q · J2 setas + L/K/P</p>

<script>
/* iOS Safari: bloqueia zoom por duplo toque e pinça, e o arraste da página */
(()=>{let last=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-last<350)e.preventDefault();last=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||!e.target.closest('.hint'))e.preventDefault()},{passive:false});
})();
</script>
<script>
(()=>{
const cv=document.getElementById('c');
let cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const CW=160,CH=288;
const W=100,L=200,NET=100,NETH=9,SV1=30.5,SV2=169.5,G=.06;
/* Perspectiva: fundo de cima mais estreito e comprimido (k=0.78) */
/* Câmeras: AEREA = vista de cima com leve inclinação; FUNDO = atrás da quadra, perspectiva mais forte e alturas mais visíveis.
   kn = largura relativa do fundo distante; e = compressão vertical do fundo; zf = escala das alturas. */
const CAMS=[
  {n:'AEREA',oy:38,h:240,wn:48000/(L*1.78),kn:.78,e:1,zf:.75,pole:9},
  {n:'FUNDO',oy:86,h:192,wn:150,kn:.55,e:1.7,zf:1,pole:44},
];
let CAM=CAMS[0];
const kf=y=>CAM.kn+(1-CAM.kn)*y/L;
const gRaw=y=>Math.pow(Math.max(.01,kf(y)),CAM.e+1)-Math.pow(CAM.kn,CAM.e+1);
const fy=y=>CAM.h*gRaw(y)/gRaw(L);
const zs=y=>CAM.wn/100*kf(y)*CAM.zf;
const proj=(x,y,z)=>[80+(x-50)*CAM.wn/100*kf(y),CAM.oy+fy(y)-z*zs(y)];
const yAt=sy=>{let lo=-60,hi=L+60;for(let i=0;i<32;i++){const m=(lo+hi)/2;if(CAM.oy+fy(m)<sy)lo=m;else hi=m}return(lo+hi)/2};
const SPEED=.85,SW=18;
const F8='8px "Press Start 2P", monospace',F16='16px "Press Start 2P", monospace';
const ACC='#ffd23f',RED='#ff5a52',WHITE='#f4f6ff',MUT='#8f8ac8',NAVY='#0d1333',GRN='#5bff7a',BLU='#7fd0ff';
const PL=['0','15','30','40'];
const RN=['OITAVAS','QUARTAS','SEMIFINAL','FINAL'],RN_NA=['NAS OITAVAS','NAS QUARTAS','NA SEMIFINAL','NA FINAL'];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,c,t)=>a+(c-a)*t;
const sideOf=y=>y>NET?0:1;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(h1,h2,t)=>{const a=hex(h1),c=hex(h2);return'rgb('+a.map((v,i)=>Math.round(lerp(v,c[i],t))).join(',')+')'};

/* ---------- dados ---------- */
const COURTS=[
  {n:'AZUL',turf:'#2a62d4',dot:'#2558c2',line:'#e6eeff',out:'#0d1333',out2:'#141b44',glass:'#6db7d9',fence:'#2e3556',bounce:.62,fric:.9},
  {n:'VERDE',turf:'#2f9a4c',dot:'#2a8a44',line:'#f0fff2',out:'#0d1a13',out2:'#15261d',glass:'#7fd0c8',fence:'#2f3a33',bounce:.64,fric:.93},
  {n:'SAIBRO',turf:'#c8643a',dot:'#b45632',line:'#fff3e6',out:'#1d120d',out2:'#2a1a12',glass:'#9fd0d9',fence:'#3a2e2a',bounce:.56,fric:.84},
  {n:'NOITE',turf:'#3270e6',dark:'#0f2350',dot:'#2558c2',line:'#d9e4ff',out:'#04060d',out2:'#0a0f22',glass:'#3f7f9e',fence:'#1c2033',bounce:.62,fric:.9,night:true},
];
const SHIRTS=['#ef3e36','#2e86ff','#ffb000','#20c070','#b05cff','#ff5ca8','#f2f2f2'];
const HAIRS=['#3b2416','#1b1b1b','#d9a441','#8a4b20','#e0e0e0','#c0392b'];
const STY={
  equil:{n:'EQUILIBRADOS',back:38,net:66,lob:.1,lobNet:.5,smash:.4,vib:.3,drop:.07,ue:1,pow:0},
  parede:{n:'PAREDOES',back:30,net:50,lob:.22,lobNet:.6,smash:.2,vib:.2,drop:.05,ue:.75,pow:-.1},
  rede:{n:'VOLEADORES',back:46,net:76,lob:.05,lobNet:.35,smash:.6,vib:.3,drop:.12,ue:1.1,pow:.08},
  globo:{n:'LOBISTAS',back:36,net:60,lob:.4,lobNet:.7,smash:.3,vib:.2,drop:.05,ue:.95,pow:-.05},
  canhoto:{n:'CANHOTOS',back:38,net:66,lob:.1,lobNet:.5,smash:.4,vib:.5,drop:.07,ue:1,pow:0,lefty:true},
};
const SKINS=['#f2c18d','#e0a878','#c68642','#8d5524','#5c3a1e'];
const HS=['short','long','tail','bald'],HS_N=['CURTO','LONGO','RABO','CARECA'];
/* jogador: [nome, cabelo(estilo), cor do cabelo, pele] */
const PAIRS=[
  {s:'parede',lv:0,c:'#c9a26b',p:[['JOAO DIAS','short','#3b2416',0],['LUIS BRUM','bald','#1b1b1b',2]]},
  {s:'globo',lv:0,c:'#ff9ed8',p:[['ANA MELO','long','#d9a441',0],['BIA ROSA','tail','#3b2416',1]]},
  {s:'equil',lv:0,c:'#9b7bff',p:[['CAIO REIS','short','#1b1b1b',3],['DAVI LUZ','short','#8a4b20',1]]},
  {s:'canhoto',lv:0,c:'#7fe0ff',p:[['LEO VAZ','short','#d9a441',0],['RUI NERI','short','#e0e0e0',1]]},
  {s:'rede',lv:0,c:'#fff36b',p:[['GABI LEAL','tail','#1b1b1b',2],['LIA GOES','long','#c0392b',0]]},
  {s:'globo',lv:1,c:'#ff8a3d',p:[['IGOR LOBO','short','#3b2416',1],['TOM CRUZ','short','#1b1b1b',4]]},
  {s:'parede',lv:1,c:'#6b8cff',p:[['NINA PAZ','long','#1b1b1b',3],['JU MOTA','tail','#8a4b20',1]]},
  {s:'canhoto',lv:1,c:'#c0c8d8',p:[['ENZO RIOS','short','#1b1b1b',2],['HUGO LINS','bald','#3b2416',0]]},
  {s:'rede',lv:1,c:'#3fb8c8',p:[['RAFA MAIA','short','#d9a441',0],['IAN ROMA','short','#3b2416',3]]},
  {s:'globo',lv:2,c:'#e8f0ff',p:[['CLARA VILA','long','#d9a441',0],['LU BRAZ','tail','#1b1b1b',4]]},
  {s:'parede',lv:2,c:'#a0a0a0',p:[['MARCOS LEME','short','#e0e0e0',1],['OTTO SENA','short','#3b2416',2]]},
  {s:'rede',lv:2,c:'#40e0a0',p:[['DANI VALE','tail','#8a4b20',1],['TATI LAGO','long','#1b1b1b',3]]},
  {s:'parede',lv:3,c:'#f2f2f2',p:[['VITOR PENA','short','#1b1b1b',1],['SAUL ALVA','bald','#3b2416',3]]},
  {s:'canhoto',lv:3,c:'#ffd23f',p:[['FELIPE LEON','short','#3b2416',0],['MATEO GIL','short','#1b1b1b',2]]},
  {s:'rede',lv:3,c:'#ff4fa0',p:[['LARA CANO','tail','#1b1b1b',2],['IRIS VEGA','long','#c0392b',0]]},
];
PAIRS.forEach(q=>{q.n=q.p.map(x=>x[0].split(' ').pop()).join('/')});
const PARTNER=['BETO RAMOS','short','#1b1b1b',1];
const NAMEGRID='ABCDEFGHIJKLMNOPQRSTUVWXYZ <';
const ATTR=[['vel','VELOCIDADE','CORRE MAIS RAPIDO'],['for','FORCA','BOLAS MAIS FORTES'],['pre','PRECISAO','MENOS ERROS'],['top','POR CIMA','REMATE E BANDEJA']];

/* ---------- salvamento ---------- */
const SAVE_KEY='padelAdvance.v1';
const save={attr:{vel:1,for:1,pre:1,top:1},xp:2,season:1,titles:0,wins:0,opts:{court:0,cam:0,btn:1,full:false,shirt:0,hair:0,golden:true,marker:false,sound:true},me:{name:'',hs:0,hair:0,skin:0,shirt:0},tour:null};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s){Object.assign(save,s,{attr:{...save.attr,...s.attr},opts:{...save.opts,...s.opts},me:{...save.me,shirt:(s.opts&&s.opts.shirt)||0,hair:(s.opts&&s.opts.hair)||0,...s.me}})}}catch(_){}
CAM=CAMS[save.opts.cam]||CAMS[0];
const BTNS=[['P',.82],['M',1],['G',1.16],['GG',1.3]];
function applyBtn(){try{document.documentElement.style.setProperty('--cs',BTNS[save.opts.btn][1])}catch(_){}}
applyBtn();
function setCam(i){save.opts.cam=i;CAM=CAMS[i];buildCrowd();store()}

/* ---------- jogadores e bola ---------- */
const P=[{team:0,homeX:72},{team:0,homeX:28},{team:1,homeX:28},{team:1,homeX:72}];
P.forEach(p=>Object.assign(p,{x:p.homeX,y:p.team?40:160,tx:p.homeX,ty:p.team?40:160,swing:0,stype:'drive',cool:0,moving:false,anim:0,lbl:'',lblT:0,
  charging:false,charge:0,ctype:'a',hand:'fh',lunge:0,lastD:1e9,ready:false,stam:1,relPow:0,shirt:'#ef3e36',shorts:'#f4f4f4',hair:'#3b2416',band:null,skill:1.5,style:'equil',lefty:false,ctrl:null}));
const b={x:50,y:100,z:0,vx:0,vy:0,vz:0,lastTeam:0,bounces:0,serving:false,mustBounce:false,netTouched:false,cord:false,box:[0,50],spin:'none',kickV:0,out:null};

let mode='title',kind='demo',demo=true,twoP=false,st='serve',timer=0,ptimer=0,frame=0;
let paused=false,pauseCur=0,cur=0,nextAfterPlayer='title',resNext='title',resLines=[],resultW=0;
let pts=[0,0],games=[0,0],serveTeam=0,faults=0,server=P[0],after=null,msg='',sub='';
let opp=0,partnerMode=['AUTO','AUTO'],marker=null,flash=null,cheer=0,replay=null,replayPending=false;
const friendly={pair:2,lvl:1};
const parts=[],rec=[];

const isPartner=p=>!isHuman(p)&&P.some(q=>q.team===p.team&&isHuman(q));
const sk=p=>Math.min(p.skill,3.5);
const stamF=p=>.78+.22*p.stam;
const attrOf=()=>twoP?{vel:3,for:3,pre:3,top:3}:save.attr;
const myName=()=>save.me.name||'VOCE';
const teamName=t=>twoP?(t?'J2':'J1'):(t?(PAIRS[opp]||PAIRS[0]).n:myName());
let nameBuf='',nameCur=0;const typeQ=[];
const golden=()=>save.opts.golden;

/* ---------- entrada ---------- */
const BTN=['left','right','up','down','a','b','sel','start'];
const down=new Set(),tapped=new Set();const tcTap={};
const tc={},dp={};BTN.forEach(k=>{tc[k]=0;dp[k]=0});
const MAP1={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],a:['KeyJ','KeyZ','Space'],b:['KeyK','KeyX'],sel:['ShiftLeft','ShiftRight'],start:['Enter','Escape']};
const MAP2A={left:['KeyA'],right:['KeyD'],up:['KeyW'],down:['KeyS'],a:['KeyF'],b:['KeyG'],sel:['KeyQ'],start:[]};
const MAP2B={left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],a:['KeyL'],b:['KeyK'],sel:['KeyP'],start:[]};
const GAMEKEYS=new Set(Object.values(MAP1).flat().concat(Object.values(MAP2A).flat(),Object.values(MAP2B).flat()));
const mkPad=()=>({cur:{},prev:{}});
const pad1=mkPad(),pad2=mkPad(),menu=mkPad();
addEventListener('keydown',e=>{if(mode==='name'){const ch=/^Key[A-Z]$/.test(e.code)?e.code[3]:e.code==='Space'?' ':e.code==='Backspace'?'<':null;if(ch){e.preventDefault();typeQ.push(ch);unlock();return}}if(GAMEKEYS.has(e.code))e.preventDefault();if(!e.repeat)tapped.add(e.code);down.add(e.code);unlock()});
addEventListener('keyup',e=>{down.delete(e.code)});

let ac=null,noiseBuf=null,quiet=false;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(_){}}
function beep(f,d=.06,type='square',vol=.07,slide=0,delay=0){
  if(!save.opts.sound||!ac||quiet)return;
  try{const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(_){}
}
function applause(n,vol){
  if(!save.opts.sound||!ac||quiet)return;
  try{
    if(!noiseBuf){noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.05),ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const t0=ac.currentTime;
    for(let i=0;i<n;i++){
      const t=t0+Math.random()*1.4,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
      s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=rnd(1100,3200);f.Q.value=1.3;
      g.gain.setValueAtTime(vol*(1-(t-t0)/1.7),t);g.gain.exponentialRampToValueAtTime(.0001,t+.045);
      s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+.05);
    }
  }catch(_){}
}

/* ---------- física ---------- */
const CT=()=>COURTS[save.opts.court];
function physics(o,ev){
  o.vz-=G;
  const py=o.y;
  o.x+=o.vx;o.y+=o.vy;o.z+=o.vz;
  if(!o.out&&(py-NET)*(o.y-NET)<=0&&py!==o.y){
    if(o.z<NETH){o.y=py<NET?NET-.6:NET+.6;o.vy*=-.15;o.vx*=.3;ev('net')}
    else if(o.z<NETH+1.3){
      if(Math.random()<.55){o.vy*=.35;o.vx*=.5;o.vz=Math.abs(o.vz)*.3+.45;ev('cord',1)}
      else{o.y=py<NET?NET-.6:NET+.6;o.vy*=-.12;o.vx*=.3;o.vz=.4;ev('cord',0)}
    }
  }
  if(o.z<=0){o.z=0;if(o.vz<0){const v=-o.vz,c=CT();
    if(o.spin==='kick'){o.vz=o.kickV;o.vx*=.92;o.vy*=.92;o.spin='none'}
    else if(o.spin==='slice'){o.vz=v>.3?v*(c.bounce-.17):0;o.vx*=c.fric-.08;o.vy*=c.fric-.08}
    else if(o.spin==='top'){o.vz=v>.3?v*(c.bounce+.16):0;o.vx*=c.fric+.02;o.vy*=c.fric+.02;o.spin='none'}
    else{o.vz=v>.3?v*c.bounce:0;o.vx*=c.fric;o.vy*=c.fric}
    ev('floor',v)}}
  if(o.out)return;
  if(o.x<0||o.x>W){const zn=wallZone(o,'x');
    if(zn==='out'||zn==='door'){o.out=zn;ev('out',zn)}else{o.x=o.x<0?0:W;bounceWall(o,'vx',zn);ev('wall',zn)}}
  if(!o.out&&(o.y<0||o.y>L)){const zn=wallZone(o,'y');
    if(zn==='out'){o.out=zn;ev('out',zn)}else{o.y=o.y<0?0:L;bounceWall(o,'vy',zn);ev('wall',zn)}}
}
/* Paredes: fundo = vidro 3 m + alambrado até 4 m; laterais = vidro nos 4 m do fundo, alambrado de 3 m no meio, com portas */
function wallZone(o,axis){
  if(axis==='y')return o.z<=30?'glass':o.z<=40?'fence':'out';
  const yd=Math.min(o.y,L-o.y);
  if(yd>=50&&yd<=70)return'door';
  if(yd<40)return o.z<=30?'glass':o.z<=40?'fence':'out';
  return o.z<=30?'fence':'out';
}
function bounceWall(o,k,zn){
  if(zn==='glass'){o[k]=-o[k]*(o.spin==='slice'?.55:.75);if(o.spin==='slice')o.vz*=.7}
  else{o[k]=-o[k]*rnd(.12,.42);o.vz*=rnd(.2,.8);const q=k==='vx'?'vy':'vx';o[q]*=rnd(.5,1.1);o[q]+=rnd(-.25,.25)}
}
function launch(tx,ty,T){
  for(let k=0;k<40;k++){
    const vx=(tx-b.x)/T,vy=(ty-b.y)/T,vz=(.5*G*T*T-b.z)/T;
    const tn=vy?(NET-b.y)/vy:-1;
    if(tn>0&&tn<T){const zn=b.z+vz*tn-.5*G*tn*tn;if(zn<NETH+2.5){T+=3;continue}}
    b.vx=vx;b.vy=vy;b.vz=vz;return;
  }
}

function onEvent(e,v){
  if(e==='floor'&&v>.3)sfx.bounce();
  if(e==='wall')(v==='fence'?sfx.fence:sfx.wall)();
  if(e==='out')sfx.out();
  if(e==='cord')sfx.cord();
  if(st!=='play')return;
  const hitT=b.lastTeam,R=1-hitT;
  if(e==='net'){b.netTouched=true;return}
  if(e==='cord'){b.netTouched=true;if(v)b.cord=true;return}
  if(b.serving){
    if(e==='wall'||e==='out')return fault();
    if(e==='floor'){
      const inBox=sideOf(b.y)===R&&b.x>=b.box[0]-1&&b.x<=b.box[1]+1&&(R===1?b.y>=SV1-1:b.y<=SV2+1);
      if(inBox&&b.cord){st='point';ptimer=60;msg='LET';sub='REPETE O SAQUE';after=()=>setupServe(true);return}
      if(!inBox)return fault();
      b.serving=false;b.bounces=1;return;
    }
    return;
  }
  if(e==='floor'){
    if(b.bounces===0){
      if(sideOf(b.y)!==R)return point(R,b.netTouched?'NA REDE':'NAO PASSOU');
      b.bounces=1;
    }else return point(hitT,b.cord?'NA FITA!':(twoP||hitT===0)?'WINNER!':'PONTO DELES');
  }
  if(e==='wall'&&b.bounces===0)return point(R,'FORA!');
  if(e==='out'){
    if(b.bounces===0)return point(R,'FORA!');
    return point(hitT,v==='door'?'POR 4!':'POR 3!');
  }
}
function ptsLabels(){const[a,c]=pts;if(a>=3&&c>=3){if(a===c)return['40','40'];return a>c?['AD','40']:['40','AD']}return[PL[a],PL[c]]}
function callLine(){const[a,c]=pts;if(a>=3&&c>=3){if(a===c)return golden()?'PONTO DE OURO':'IGUAIS';return'VANT. '+teamName(a>c?0:1)}const l=ptsLabels();return l[0]+' - '+l[1]}
function point(w,why){
  st='point';ptimer=105;faults=0;

function setupServe(keepFault){
  if(!keepFault)faults=0;

  server=serveTeam===0?(even?P[0]:P[1]):(even?P[2]:P[3]);
  const leftBox=server.homeX>50;
  b.box=leftBox?[0,50]:[50,100];
  const rT=1-serveTeam;
  const recv=P.find(q=>q.team===rT&&(q.homeX<50)===leftBox);
  P.forEach(p=>{
    if(p===server){p.x=p.homeX>50?70:30;p.y=serveTeam===0?190:10}
    else if(p.team===serveTeam){p.x=p.homeX;p.y=serveTeam===0?124:76}
    else if(p===recv){p.x=p.homeX>50?78:22;p.y=rT===0?190:10}
    else{p.x=p.homeX;p.y=rT===0?162:38}
    p.tx=p.x;p.ty=p.y;p.swing=0;p.cool=0;p.moving=false;p.charging=false;p.charge=0;p.lunge=0;p.relPow=0;
    p.stam=Math.min(1,p.stam+.16);
  });
  b.vx=b.vy=b.vz=0;b.lastTeam=serveTeam;b.bounces=0;b.serving=false;b.mustBounce=false;b.spin='none';b.out=null;b.cord=false;
  marker=null;st='serve';timer=0;
}
function doServe(s,pow,ctype){
  const toTop=s.team===0,[x0,x1]=b.box;
  if(pow==null)pow=rnd(.4,.8);
  if(!ctype)ctype=Math.random()<.5?'a':'b';
  pow*=.75+.25*s.stam;
  let tx=rnd(x0+10,x1-10),ty=toTop?rnd(SV1+8,SV1+22):rnd(SV2-22,SV2-8);
  if(isHuman(s)){const C=s.ctrl.cur;if(C.left)tx=x0+7;else if(C.right)tx=x1-7;const e=pow*pow*8*(1.3-.1*attrOf(s).pre);tx+=rnd(-e,e);ty+=rnd(-e,e)*(toTop?-1:1)}
  else if(!isPartner(s)){const e=Math.max(2.5,13-3*sk(s))*.45;tx+=rnd(-e,e);ty+=rnd(-e,e)}
  b.x=s.x+3;b.y=s.y+(toTop?-3:3);b.z=6;
  const cut=ctype==='b';
  launch(tx,ty,Math.hypot(tx-b.x,ty-b.y)/((cut?1.8:1.6)+.8*pow));
  b.lastTeam=s.team;b.bounces=0;b.serving=true;b.mustBounce=true;b.netTouched=false;b.cord=false;b.out=null;

  s.charging=false;s.swing=Math.round(SW*.7);s.stype='serve';st='play';beep(560,.05,'square',.07,1.4);

}

/* ---------- golpes ----------
   Força = tempo segurando A/B (0.25 a 1), limitada pelo fôlego.
   Qualidade = timing do contato: bola ao lado do corpo (~5) e um pouco à frente (~ -1). */
const canHit=p=>st==='play'&&b.lastTeam!==p.team&&sideOf(b.y)===p.team&&b.bounces<=1&&!(b.mustBounce&&b.bounces===0);
const reach=(p,r)=>{const dx=b.x-p.x,dy=b.y-p.y,zm=isHuman(p)?22+.8*attrOf(p).top:24;return dx*dx+dy*dy<=r*r&&b.z<=zm};
const depthOf=p=>p.team===0?b.y-p.y:p.y-b.y;
const rmOf=p=>(p.team===0?1:-1)*(p.lefty?-1:1);
const handFor=p=>((b.x-p.x)*rmOf(p))>=-1?'fh':'bh';
const OVER=['smash','bandeja','vibora'];
function doHit(p,type,tx,deep,pow,q,dy){
  const toTop=p.team===0,yy=a=>toTop?a:L-a,rm=rmOf(p),hs=p.hand==='bh'?-1:1;
  pow*=.75+.25*p.stam;
  if(!OVER.includes(type))tx+=(dy+1)*2.4*rm*hs;
  let ty,sp,spin='none';
  if(type==='lob'){ty=yy(lerp(30,6,pow));sp=1.3+.4*pow}
  else if(type==='smash'){const side=tx<20||tx>80;ty=yy(side?rnd(56,64):rnd(46,60));sp=2.6+1.2*pow;spin='kick'}
  else if(type==='bandeja'){ty=yy(lerp(26,10,pow));sp=1.7+.6*pow;spin='slice'}
  else if(type==='vibora'){tx=tx<50?rnd(6,14):rnd(86,94);ty=yy(lerp(36,16,pow));sp=2.2+.8*pow;spin='slice'}
  else if(type==='drop'){ty=yy(lerp(88,70,pow));sp=1+.6*pow;spin='slice'}
  else{ty=yy(deep?lerp(20,6,pow):lerp(46,16,pow));sp=(1.9+1.2*pow)*(p.hand==='bh'?.94:1)}
  sp*=.85+.15*q;
  let e=(1-q)*12+pow*pow*5,kickMul=1;
  if(isHuman(p)){
    const a=attrOf(p);sp*=.9+.04*a.for;e*=1.3-.1*a.pre;if(OVER.includes(type))e*=1.25-.1*a.top;kickMul=(.9+.05*a.for)*(.94+.03*a.top);
  }else{
    const S=STY[p.style]||STY.equil,partner=isPartner(p);
    e+=partner?3:Math.max(2.5,13-3*sk(p))*.5;
    const inSp=Math.hypot(b.vx,b.vy);
    const ue=((partner?.12:Math.max(.06,.22-.04*sk(p)))*S.ue+Math.max(0,inSp-1.8)*.12+({smash:.08,vibora:.05,bandeja:-.04}[type]||0))*.9;
    if(Math.random()<ue){if(Math.random()<.5)tx=Math.random()<.5?-9:109;else ty=yy(-14)}
  }
  tx+=rnd(-e,e);ty+=rnd(-e,e)*.6;
  const kz=b.z;
  launch(tx,ty,Math.max(14,Math.hypot(tx-b.x,ty-b.y)/sp));
  b.lastTeam=p.team;b.bounces=0;b.mustBounce=false;b.serving=false;b.netTouched=false;b.cord=false;b.out=null;
  b.spin=spin;b.kickV=(kz>=19?1:.65)*(1.5+2*pow)*(.8+.2*q)*kickMul;
  p.charging=false;p.charge=0;p.swing=Math.round(SW*.7);p.stype=type;p.lunge=Math.abs(b.x-p.x)>9?14:0;
  p.stam=Math.max(0,p.stam-(.012+pow*.012));
  flash={x:b.x,y:b.y,z:b.z,t:6};
  const LB={smash:'REMATE',bandeja:'BANDEJA',vibora:'VIBORA',drop:'DEJADA',lob:'GLOBO'};
  if(isHuman(p)){p.lbl=q>.82?(LB[type]?LB[type]+'!':'PERFEITO'):dy<-4?'CEDO':dy>2.5?'TARDE':(LB[type]||'');p.lblT=p.lbl?42:0}
  else if(LB[type]&&type!=='lob'){p.lbl=LB[type];p.lblT=42}
  if(type==='smash'||type==='vibora')sfx.smash();else if(type==='lob')sfx.lob();else beep(480+pow*360,.05,'square',.07,1.4);
  planTeam(0);planTeam(1);
}
function humanHit(h,pow){
  const a=attrOf(h),C=h.ctrl.cur,dx=Math.abs(b.x-h.x),dy=depthOf(h);
  const q=clamp((1-clamp(Math.abs(dx-5)/(8+.5*a.pre),0,1))*.4+(1-clamp(Math.abs(dy+1)/8,0,1))*.6,0,1);
  h.hand=handFor(h);

  else{type=h.ctype==='b'?'lob':'drive';if(type==='drive'&&C.up)type='drop'}
  const tx=C.left?rnd(8,18):C.right?rnd(82,92):rnd(35,65);

}
function aiHit(p){
  const S=STY[p.style]||STY.equil;
  const opp=P.filter(q=>q.team!==p.team);
  const oppNet=opp.every(q=>Math.abs(q.y-NET)<40);
  let type='drive';
  const r=Math.random();
  if(b.z>17&&Math.abs(p.y-NET)<48)type=(b.z>19&&r<S.smash)?'smash':Math.random()<S.vib?'vibora':'bandeja';
  else if(b.z>19&&r<.3)type='bandeja';
  else if((oppNet&&Math.random()<S.lobNet)||Math.random()<S.lob)type='lob';
  else if(Math.random()<S.drop&&Math.abs(p.y-NET)<50)type='drop';
  let best=50,bs=-1;
  for(const c of[12,30,50,70,88]){const s=Math.min(...opp.map(q=>Math.abs(q.x-c)))+Math.random()*10;if(s>bs){bs=s;best=c}}
  if(S.lefty&&Math.random()<.5)best=Math.random()<.5?12:88;
  if(type==='smash'&&Math.random()<.4)best=Math.random()<.5?10:90;
  const s=isPartner(p)?1.6:sk(p);
  const q=rnd(.35+.1*Math.min(s,3),1),pow=clamp(rnd(.35,.8)+s*.04+S.pow+(type==='smash'?.15:0),.25,1);
  p.hand=handFor(p);

const aiSpeed=p=>(isPartner(p)?1.05:(.82+.11*sk(p))*1.05)*stamF(p);
const humanSpeed=p=>(twoP?1.25:1.12+.045*attrOf(p).vel)*stamF(p);
function predictFor(team){
  const s={x:b.x,y:b.y,z:b.z,vx:b.vx,vy:b.vy,vz:b.vz,bounces:b.bounces,mustBounce:b.mustBounce,spin:b.spin,kickV:b.kickV,out:b.out};
  const out=[];
  for(let t=1;t<180;t++){
    let stop=false;
    physics(s,e=>{
      if(e==='floor'){if(s.bounces===0&&sideOf(s.y)!==team)stop=true;else{s.bounces++;if(s.bounces>=2)stop=true}}
      else if((e==='wall'&&s.bounces===0)||e==='out')stop=true;
    });
    if(stop)break;
    if(sideOf(s.y)===team&&s.z<=19&&!(s.mustBounce&&s.bounces===0))out.push({x:s.x,y:s.y,t});
  }
  return out;
}
function predictBounce(){
  const s={x:b.x,y:b.y,z:b.z,vx:b.vx,vy:b.vy,vz:b.vz,spin:b.spin,kickV:b.kickV,out:b.out};
  for(let t=0;t<220;t++){let hit=null;physics(s,e=>{if(e==='floor'&&!hit)hit={x:s.x,y:s.y};if(e==='out'&&!hit)hit={out:1}});if(hit)return hit.out?null:hit}
  return null;
}
function homeYFor(p,weHit){
  const S=STY[p.style]||STY.equil;let back=S.back,net=S.net;
  if(isPartner(p)){const m=partnerMode[p.team];if(m==='REDE'){back=72;net=74}else if(m==='FUNDO'){back=32;net=36}}
  const v=weHit?net:back;
  return p.team===0?L-v:v;
}
function planTeam(team){
  const mates=P.filter(p=>p.team===team&&!isHuman(p));
  const weHit=st==='play'&&b.lastTeam===team;
  mates.forEach(p=>{p.tx=p.homeX;p.ty=homeYFor(p,weHit)});
  if(st!=='play'||b.lastTeam===team||!mates.length)return;
  const cand=predictFor(team);if(!cand.length)return;
  const hu=P.find(q=>q.team===team&&isHuman(q));
  const skip=q=>hu&&(hu.homeX>50?q.x>54:q.x<46);
  let best=null;
  for(const p of mates){
    const sp=aiSpeed(p);
    for(const q of cand){
      if(skip(q))continue;
      if(Math.hypot(q.x-p.x,q.y-p.y)<=sp*q.t+6){if(!best||q.t<best.q.t)best={p,q};break}
    }
  }
  if(!best){
    const q=cand[cand.length-1];
    if(!skip(q)){let d=1e9;for(const p of mates){const dd=Math.hypot(q.x-p.x,q.y-p.y);if(dd<d){d=dd;best={p,q}}}}
  }
  if(best){best.p.tx=best.q.x;best.p.ty=best.q.y+(team===0?3:-3)}
}
function constrain(p){p.x=clamp(p.x,3,97);p.y=p.team===0?clamp(p.y,NET+6,197):clamp(p.y,3,NET-6)}
function moveAI(p){
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),sp=aiSpeed(p);
  if(d>.6){const m=Math.min(sp,d);p.x+=dx/d*m;p.y+=dy/d*m;p.moving=true}else p.moving=false;
  constrain(p);
}
function togglePartner(t){
  const M=['AUTO','REDE','FUNDO'];partnerMode[t]=M[(M.indexOf(partnerMode[t])+1)%3];
  const pt=P.find(p=>p.team===t&&!isHuman(p));if(pt){pt.lbl=partnerMode[t];pt.lblT=50}
  sfx.ui();planTeam(t);
}

/* ---------- replay ---------- */
function snap(){
  rec.push({b:[b.x,b.y,b.z],p:P.map(p=>[p.x,p.y,p.swing,p.stype,p.hand,p.charging,p.charge,p.moving,p.anim,p.ready,p.lunge]),f:flash?{...flash}:null});
  if(rec.length>260)rec.shift();
}
function applySnap(s){
  [b.x,b.y,b.z]=s.b;
  P.forEach((p,i)=>{[p.x,p.y,p.swing,p.stype,p.hand,p.charging,p.charge,p.moving,p.anim,p.ready,p.lunge]=s.p[i];p.lblT=0});
  flash=s.f?{...s.f}:null;
}
function startReplay(){
  const f=rec.slice(Math.max(0,rec.length-210),Math.max(1,rec.length-25));
  if(f.length<10){if(after){const g=after;after=null;g()}return}
  replay={f,i:0};st='replay';
}

/* ---------- passo do jogo ---------- */
function humanStep(h){
  const pd=h.ctrl,C=pd.cur;
  if(prs(pd,'sel'))togglePartner(h.team);
  const pa=prs(pd,'a'),pb=prs(pd,'b'),isServer=st==='serve'&&server===h;
  if(!h.charging&&(pa||pb)&&(h.swing===0||isServer)){h.charging=true;h.charge=0;h.ctype=pa?'a':'b';h.lastD=1e9;h.hand=handFor(h)}
  if(h.charging){
    h.charge=Math.min(1,h.charge+1/(44-2*attrOf(h).for));
    if(isServer){if(!C[h.ctype])doServe(h,.25+.75*h.charge,h.ctype)}
    else{
      h.hand=handFor(h);
      if(canHit(h)&&reach(h,14)){
        const d=Math.hypot(b.x-h.x,b.y-h.y);
        if(depthOf(h)>=-1.5||(d>h.lastD&&d>10))humanHit(h,.25+.75*h.charge);
        else h.lastD=d;
      }
      if(h.charging&&!C[h.ctype]){h.charging=false;h.swing=SW;h.stype=h.ctype==='b'?'lob':'drive';h.relPow=.25+.75*h.charge}
    }
  }
  if(!h.charging&&h.swing>SW*.3&&h.relPow&&canHit(h)&&reach(h,14)){const pw=h.relPow;h.relPow=0;humanHit(h,pw)}
  if(h.swing===0)h.relPow=0;
  const mx=C.right-C.left,my=C.down-C.up;
  if(!isServer&&(mx||my)){const d=Math.hypot(mx,my),sp=humanSpeed(h)*(h.charging?.62:h.swing>0?.55:1);h.x+=mx/d*sp;h.y+=my/d*sp;h.moving=true}else h.moving=false;
  constrain(h);
}
function stepGame(){
  if(st==='replay'){
    replay.i+=.5;const i=Math.floor(replay.i);
    if(i>=replay.f.length||prs(menu,'a')||prs(pad1,'a')){applySnap(replay.f[replay.f.length-1]);replay=null;st='point';ptimer=1;replayPending=false}
    else{applySnap(replay.f[i]);return}
  }
  timer++;
  if(frame%5===0){
    planTeam(0);planTeam(1);
    marker=(markerOn()&&st==='play'&&b.bounces===0&&P.some(p=>p.team!==b.lastTeam&&isHuman(p)))?predictBounce():null;
  }
  for(const p of P)if(isHuman(p))humanStep(p);
  for(const p of P){
    if(!isHuman(p)){
      if(st==='serve'){p.moving=false;p.charging=p===server&&timer>(demo?22:37);if(p.charging)p.charge=Math.min(1,p.charge+1/40)}
      else{
        moveAI(p);
        const want=canHit(p)&&reach(p,22)&&p.cool<=0;
        if(want&&!p.charging){p.charging=true;p.charge=0}
        if(p.charging){p.charge=Math.min(1,p.charge+1/40);p.hand=handFor(p);if(!want)p.charging=false}
      }
    }
    p.ready=st==='play'&&b.lastTeam!==p.team&&!p.moving;
    if(p.swing>0)p.swing--;if(p.cool>0)p.cool--;if(p.lblT>0)p.lblT--;if(p.lunge>0)p.lunge--;
    if(p.moving){p.stam=Math.max(0,p.stam-.0009);p.anim++;if(p.anim%8===0&&parts.length<40)parts.push({x:p.x+rnd(-1,1),y:p.y,t:14})}
    else p.stam=Math.min(1,p.stam+.0004);
  }
  for(let i=parts.length-1;i>=0;i--)if(--parts[i].t<=0)parts.splice(i,1);
  if(flash&&--flash.t<=0)flash=null;
  if(st==='serve'){
    const ch=server.charging?server.charge:0;
    b.x=server.x+3;b.y=server.y+(server.team===0?-2:2);b.z=ch>0?6+ch*10:Math.abs(Math.sin(timer*.09))*7;b.vx=b.vy=b.vz=0;
    if(!isHuman(server)&&timer>(demo?40:55))doServe(server);
    return;
  }
  physics(b,onEvent);
  if(!demo&&(st==='play'||st==='point'))snap();
  if(st==='play'){
    for(const p of P){
      if(isHuman(p)||p.cool>0||!canHit(p)||!reach(p,10.5))continue;
      const miss=isPartner(p)?.03:Math.max(.01,.10-.027*sk(p));
      if(Math.random()<miss){p.cool=45;p.charging=false;p.swing=SW;p.stype='drive'}else aiHit(p);
      if(st!=='play')break;
    }
  }else if(st==='point'){
    if(--ptimer<=0){
      if(replayPending){replayPending=false;startReplay()}
      else if(after){const f=after;after=null;f()}
    }
  }
}

const courtCache={};
function getBg(){const k='bg'+save.opts.court;if(!courtCache[k])courtCache[k]=buildBg(COURTS[save.opts.court]);return courtCache[k]}
function getCourt(){const k=save.opts.court+'_'+save.opts.cam;if(!courtCache[k])courtCache[k]=buildCourt(COURTS[save.opts.court]);return courtCache[k]}
function buildBg(C){
  const c=document.createElement('canvas');c.width=CW;c.height=CH;const g=c.getContext('2d');
  g.fillStyle=C.out;g.fillRect(0,0,CW,CH);g.fillStyle=C.out2;
  for(let y=30;y<CH;y+=4)for(let x=2;x<CW;x+=6)g.fillRect(x+((y>>2)%2)*3,y,1,1);
  return c;
}
function buildCourt(C){
  const c=document.createElement('canvas');c.width=CW;c.height=CH;const g=c.getContext('2d');
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)};
  const T=CAM.oy,Bt=CAM.oy+CAM.h,back3d=CAM===CAMS[1];
  const lampW=C.night?[[-8,-4],[108,-4],[-8,100],[108,100],[-8,204],[108,204]]:[];
  const lamps=lampW.map(([x,y])=>proj(x,y,0));
  const light=(x,y)=>{let f=0;for(const[lx,ly]of lamps){const d2=(x-lx)**2+(y-ly)**2;f+=Math.exp(-d2/(2*46*46))}return clamp(f,0,1)};
  const zone=y=>{const yd=Math.min(y,L-y);return yd<40?'glass':(yd>=50&&yd<=70)?'door':'fence'};
  const top=proj(0,0,0),bot=proj(0,L,0);
  if(!back3d){
    R(top[0]-3,T-3,CW-2*(top[0]-3),3,C.glass);
    for(let x=Math.round(top[0]);x<CW-top[0];x+=7)R(x,T-3,2,1,'#d8f7ff');
  }
  R(bot[0]-3,Bt,CW-2*(bot[0]-3),3,C.glass);
  for(let x=Math.round(bot[0]);x<CW-bot[0];x+=7)R(x,Bt,2,1,'#d8f7ff');
  for(let sy=T;sy<Bt;sy++){
    const y=yAt(sy+.5),xl=Math.round(proj(0,y,0)[0]),xr=CW-xl,row=sy-T;
    if(C.night){for(let x=xl;x<xr;x+=2){const f=light(x,sy);g.fillStyle=mix(C.dark,C.turf,f);g.fillRect(x,sy,2,1)}}
    else{g.fillStyle=C.turf;g.fillRect(xl,sy,xr-xl,1)}
    if(row%2===0){g.fillStyle=C.night?'rgba(0,0,0,.12)':C.dot;for(let x=xl+((row>>1)%2)*2;x<xr;x+=4)g.fillRect(x,sy,1,1)}
    if(back3d)continue;
    const z=zone(y);
    for(const wx of[xl-3,xr]){
      if(z==='glass'){R(wx,sy,3,1,C.glass);if(row%8===2||row%8===3)R(wx+1,sy,1,1,'#d8f7ff')}
      else if(z==='fence'){R(wx,sy,3,1,C.fence);if(row%2===0)R(wx+(row%4?0:2),sy,1,1,'#56608c')}
      else R(wx,sy,3,1,C.out);
    }
  }
  if(!back3d)for(const yd of[50,70,130,150]){const[px,py]=proj(0,yd,0);R(px-3,py,3,1,'#9aa3c8');R(CW-px,py,3,1,'#9aa3c8')}
  const lc=C.night?mix(C.line,C.dark,.25):C.line;
  for(const sv of[SV1,SV2]){const[px,py]=proj(0,sv,0);R(px,py,CW-2*px,1,lc)}
  const c1=proj(50,SV1,0)[1],c2=proj(50,SV2,0)[1];R(80,c1,1,Math.round(c2-c1),lc);
  if(back3d){

    txt('A EVOLUI',80,240,save.xp?ACC:MUT,'center');txt('B CONTINUA',80,256,MUT,'center');
    return;
  }
  if(mode==='options'){
    dim(.82);txt('OPCOES',80,40,ACC,'center',F16);const o=save.opts;
    const rows=[['QUADRA',COURTS[o.court].n],['CAMERA',CAMS[o.cam].n],['40-40',o.golden?'OURO':'VANTAGEM'],['QUIQUE',o.marker?'MARCA':'NAO'],['BOTOES',BTNS[o.btn][0]],['SOM',o.sound?'SIM':'NAO'],['TELA',o.full?'CHEIA':'GBA']];
    rows.forEach(([l,v],i)=>{const y=70+i*18,on=cur===i;txt(l,10,y,on?ACC:WHITE);txt(v,150,y,on?ACC:MUT,'right');
      if(on&&Math.floor(frame/16)%2)txt('<',150-v.length*8-12,y,ACC)});
    txt('CAMISA E VISUAL',80,204,MUT,'center');txt('EM PERSONAGEM',80,216,MUT,'center');
    txt('B VOLTAR',80,264,MUT,'center');
    return;
  }
  if(mode==='create'){
    dim(.82);txt('ATLETA',80,36,ACC,'center',F16);const me=save.me;
    const rows=[['NOME',me.name||'---'],['CABELO',HS_N[me.hs]],['COR',null,HAIRS[me.hair]],['PELE',null,SKINS[me.skin]],['CAMISA',null,SHIRTS[me.shirt]],['PRONTO','']];
    rows.forEach(([l,v,sw],i)=>{const y=62+i*16,on=cur===i;txt(l,10,y,on?ACC:WHITE);
      if(sw){R(126,y-1,24,9,'#05071a');R(127,y,22,7,sw)}else if(v)txt(v,150,y,on?ACC:MUT,'right');
      if(on&&i>0&&i<5&&Math.floor(frame/16)%2)txt('<',sw?112:150-v.length*8-12,y,ACC)});
    const pv=(team,X)=>{Object.assign(preview,{team,shirt:SHIRTS[me.shirt],hair:HAIRS[me.hair],skin:SKINS[me.skin],hs:HS[me.hs],moving:true,anim:frame>>1});
      const off=document.createElement('canvas');off.width=24;off.height=26;const s_=cx;cx=off.getContext('2d');drawSprite(preview,12,22,false);cx=s_;cx.drawImage(off,X-36,166,72,78)};
    pv(1,48);pv(0,112);
    txt(cur===0?'A EDITA NOME':cur===5?'A CONFIRMA':'< > MUDA',80,256,ACC,'center');txt('B SAI',80,270,MUT,'center');
    return;
  }
  if(mode==='name'){
    dim(.86);txt('SEU NOME',80,40,ACC,'center',F16);
    R(24,70,112,16,'#05071a');txt(nameBuf+(Math.floor(frame/16)%2&&nameBuf.length<8?'_':''),30,74,WHITE);
    for(let i=0;i<28;i++){const c=i%7,r=(i/7)|0,x=17+c*18,y=104+r*20,on=i===nameCur,ch=NAMEGRID[i];
      if(on)R(x-3,y-4,16,16,'#2b3470');txt(ch===' '?'_':ch==='<'?'<-':ch,x+(ch==='<'?-3:0),y,on?ACC:WHITE)}
    const on=nameCur===28;if(on)R(56,186,48,16,'#2b3470');txt('OK',80,190,on?ACC:WHITE,'center');
    txt('ATE 8 LETRAS',80,222,MUT,'center');txt('TECLADO OU A',80,240,MUT,'center');txt('START CONFIRMA',80,254,MUT,'center');
    return;
  }
  drawWorld();
  if(mode==='game'||mode==='result'||mode==='champion')drawHUD();
  if(mode==='result'){
    dim(.78);const win=twoP?true:resultW===0;
    txt(twoP?'FIM DE JOGO':win?'VITORIA!':'DERROTA',80,70,win?ACC:RED,'center',F16);
    txt(games[0]+' - '+games[1],80,100,WHITE,'center',F16);
    resLines.forEach((s,i)=>txt(s,80,140+i*14,i===resLines.length-1&&s.startsWith('+')?GRN:WHITE,'center'));
    if(Math.floor(frame/28)%2)txt('A CONTINUA',80,240,ACC,'center');
    return;
  }
  if(mode==='champion'){
    dim(.82);
    const bob=Math.round(Math.sin(frame*.08)*2);drawTrophy(80,70+bob,3);
    for(let i=0;i<6;i++){const a=frame*.05+i*1.05,r=44+Math.sin(frame*.1+i)*4;if((frame+i*5)%20<12)R(80+Math.cos(a)*r,94+Math.sin(a)*r*.8,1,1,i%2?ACC:WHITE)}
    txt('CAMPEOES!',80,140,ACC,'center',F16);
    txt('TEMPORADA '+(save.season-1),80,166,WHITE,'center');txt('TITULOS: '+save.titles,80,180,MUT,'center');txt('+5 PONTOS',80,196,GRN,'center');
    if(Math.floor(frame/28)%2)txt('A CONTINUA',80,240,ACC,'center');
    return;
  }
  if(st==='replay'){
    R(0,32,CW,14,'#000');R(0,CH-8,CW,8,'#000');
    if(Math.floor(frame/20)%2)R(6,36,4,4,RED);txt('REPLAY',14,35,WHITE);
    txt('A PULA',CW-6,35,MUT,'right');
  }
  if(paused){
    const y=98;cx.fillStyle='rgba(13,19,51,.95)';cx.fillRect(14,y,132,118);R(14,y,132,1,ACC);R(14,y+117,132,1,ACC);
    txt('PAUSA',80,y+8,ACC,'center');
    ['CONTINUAR','CAM: '+CAMS[save.opts.cam].n,'SOM: '+(save.opts.sound?'SIM':'NAO'),'TELA: '+(save.opts.full?'CHEIA':'GBA'),'SAIR'].forEach((s,i)=>txt((i===pauseCur?'> ':'  ')+s,20,y+28+i*16,i===pauseCur?ACC:WHITE));
  }else if(st==='point')banner(msg,sub,msg==='WINNER!'||msg.startsWith('POR')||msg==='NA FITA!'||msg.startsWith('GAME')?ACC:msg==='PONTO DELES'?RED:ACC);
  else if(st==='serve'&&timer<50&&pts[0]+pts[1]===0&&!faults)banner('SAQUE '+teamName(serveTeam),'GAMES '+games[0]+'-'+games[1]);
}


/* ---------- carregamento e abertura ---------- */
const TIPS=['BANDEJA E MAIS|SEGURA QUE REMATE','SEGURE A PARA|CARREGAR A FORCA','DEIXE A BOLA|VOLTAR DO VIDRO','LOB NO FUNDO TIRA|A DUPLA DA REDE','REMATE NA LATERAL|PODE SAIR POR 4','CANSOU? ENCURTE|OS PONTOS','VIBORA: SEGURE|CIMA E APERTE A','O SAQUE E CRUZADO|E POR BAIXO'];
let bootT=0,bootP=0,bootStep=0,bootReady=false,fontOk=false,introT=0,tapAny=false;const tip=TIPS[(Math.random()*TIPS.length)|0];
try{(document.fonts?document.fonts.load('16px "Press Start 2P"'):Promise.resolve()).then(()=>{fontOk=true},()=>{fontOk=true})}catch(_){fontOk=true}
setTimeout(()=>{fontOk=true},2500);
cv.addEventListener('pointerdown',()=>{tapAny=true;unlock()});
const bootSteps=[()=>getBg(),()=>getCourt(),()=>{const c=save.opts.cam;CAM=CAMS[1-c];getCourt();CAM=CAMS[c]},()=>buildCrowd()];
const anyKey=()=>prs(menu,'a')||prs(menu,'b')||prs(menu,'start')||tapAny;
function stepBoot(){
  bootT++;
  if(bootStep<bootSteps.length&&bootT>8){bootSteps[bootStep]();bootStep++}
  const target=Math.min((bootStep/bootSteps.length)*.85+(fontOk?.15:0),bootT/75);
  bootP+=(target-bootP)*.12;if(target>=1&&bootP>.995)bootP=1;
  if(bootP>=1&&!bootReady){bootReady=true;tapAny=false}
  if(bootReady&&anyKey()){tapAny=false;unlock();mode='intro';introT=0}
}
const easeB=p=>{const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375};
const LOGO='PADEL',L_T0=62,L_GAP=10,ADV_T=L_T0+5*L_GAP+14,PRESS_T=ADV_T+44;
function stepIntro(){
  const t=++introT;
  if(t===24||t===40)sfx.bounce();
  if(t===52){beep(1400,.12,'square',.06,.3);applause(6,.02)}
  for(let i=0;i<5;i++)if(t===L_T0+i*L_GAP+12)beep([523,587,659,698,784][i],.07,'square',.07);
  if(t===ADV_T+10)[784,988,1175,1568].forEach((f,i)=>beep(f,.16,'square',.06,0,i*.07));
  if(t===PRESS_T+2)applause(26,.04);
  if(tapAny||prs(menu,'a')||prs(menu,'start')||prs(menu,'b')){tapAny=false;if(t<PRESS_T)introT=PRESS_T;else finishIntro()}
  if(t>PRESS_T+420)finishIntro();
}
function finishIntro(){sfx.ui();buildCrowd();enterDemo();if(!save.me.name){mode='create';cur=0}}
function drawBoot(){
  R(0,0,CW,CH,NAVY);
  for(let y=0;y<CH;y+=4)for(let x=2;x<CW;x+=6)R(x+((y>>2)%2)*3,y,1,1,'#141b44');
  const by=150-Math.round(Math.abs(Math.sin(bootT*.09))*26);
  R(78,by,5,5,'#dfff3a');R(78,by,2,2,'#fff');R(77,156,7,1,'rgba(0,0,0,.6)');
  R(36,158,88,1,'#2b3470');
  if(fontOk)txt(bootReady?'PRONTO!':'CARREGANDO',80,176,bootReady?ACC:MUT,'center');
  R(29,192,102,8,'#05071a');R(30,193,Math.round(100*bootP),6,bootReady?GRN:ACC);
  for(let x=30;x<30+100*bootP;x+=4)R(x,193,1,1,'rgba(255,255,255,.35)');
  if(fontOk){txt('DICA',80,220,MUT,'center');tip.split('|').forEach((l,i)=>txt(l,80,234+i*12,WHITE,'center'))}
  if(bootReady&&Math.floor(bootT/24)%2)txt(matchMedia('(pointer:coarse)').matches?'TOQUE NA TELA':'APERTE START',80,112,ACC,'center');
}
function drawIntro(){
  const t=introT;
  R(0,0,CW,CH,'#05060f');
  if(t>=52){
    const p=clamp((t-52)/26,0,1),h=Math.round(CH*p);
    cx.save();cx.beginPath();cx.rect(0,(CH-h)/2,CW,h);cx.clip();cx.drawImage(getBg(),0,0);drawCrowd();cx.drawImage(getCourt(),0,0);cx.restore();
    cx.fillStyle=`rgba(5,6,15,${.55*p})`;cx.fillRect(0,0,CW,CH);
  }
  if(t<52){
    let y;if(t<24)y=-6+(150+6)*(t/24)**2;else if(t<40){const u=(t-24)/16;y=150-44*Math.sin(u*Math.PI)}else{const u=(t-40)/12;y=150-12*Math.sin(u*Math.PI)}
    R(77,Math.round(y)-2,5,5,'#dfff3a');R(77,Math.round(y)-2,2,2,'#fff');
    const sh=clamp(1-(150-y)/80,.2,1);R(80-Math.round(4*sh),153,Math.round(8*sh),1,'rgba(220,230,255,.35)');
  }else if(t<62){const r=(t-52)*14;cx.fillStyle=`rgba(255,255,255,${1-(t-52)/10})`;cx.beginPath();cx.arc(80,150,r,0,7);cx.fill()}
  cx.font=F16;const lw=cx.measureText(LOGO).width/5,lx0=80-lw*2;
  for(let i=0;i<5;i++){
    const t0=L_T0+i*L_GAP;if(t<t0)continue;
    const p=clamp((t-t0)/16,0,1),y=Math.round(84-130*(1-easeB(p))),x=Math.round(lx0+i*lw);
    cx.font=F16;cx.textAlign='center';cx.textBaseline='top';
    cx.fillStyle='#05071a';cx.fillText(LOGO[i],x+2,y+3);cx.fillStyle='#ef3e36';cx.fillText(LOGO[i],x+2,y+2);cx.fillStyle=WHITE;cx.fillText(LOGO[i],x,y);
  }
  if(t>=ADV_T){
    const p=clamp((t-ADV_T)/14,0,1),x=Math.round(80+(1-p)*(1-p)*140);
    txt('ADVANCE',x,108,ACC,'center');
    const sx=Math.round(-20+((t-ADV_T-14)%90)*3.2);
    if(p>=1&&sx<190){cx.save();cx.beginPath();cx.rect(50,106,60,12);cx.clip();cx.fillStyle='rgba(255,255,255,.7)';for(let k=0;k<3;k++)cx.fillRect(sx+k*3-12,106,1,12);cx.restore()}
  }
  if(t>=ADV_T+16){for(let i=0;i<8;i++){const a=i*.785+t*.03,r=54+Math.sin(t*.07+i)*3;if((t+i*7)%24<14)R(80+Math.cos(a)*r,96+Math.sin(a)*r*.55,1,1,i%2?ACC:WHITE)}}
  if(t>=PRESS_T){
    if(Math.floor(t/24)%2)txt('PRESS START',80,206,ACC,'center');
    txt('TEMPORADA '+save.season,80,250,MUT,'center');
  }
}
/* ---------- tela: modo GBA ou tela cheia ---------- */
const landQ=()=>matchMedia('(orientation:landscape) and (max-height:560px)').matches;
function fitCanvas(){
  try{
    if(!save.opts.full){cv.style.width='';cv.style.height='';return}
    const g=document.querySelector('.gba'),bz=document.querySelector('.bezel');
    let w,h;
    if(landQ()){h=g.clientHeight-8;const side=document.querySelector('.dpad').getBoundingClientRect().width;w=g.clientWidth-2*Math.max(side,140)-40}
    else{w=bz.clientWidth;h=bz.clientHeight}
    const s=Math.max(.5,Math.min(w/160,h/288));
    cv.style.width=Math.floor(160*s)+'px';cv.style.height=Math.floor(288*s)+'px';
  }catch(_){}
}
function applyScreen(){try{document.body.classList.toggle('full',!!save.opts.full)}catch(_){}requestAnimationFrame(fitCanvas)}
addEventListener('resize',()=>requestAnimationFrame(fitCanvas));
addEventListener('orientationchange',()=>setTimeout(fitCanvas,250));
/* ---------- loop ---------- */
mode='boot';applyScreen();
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  const stepMs=1000/(60*SPEED);
  while(acc>=stepMs){update();acc-=stepMs}
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
